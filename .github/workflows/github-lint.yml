name: GitHub Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-lint:
    uses: cboone/gh-actions/.github/workflows/lint-github-actions.yml@844bf31d4ec26df9d0aa531e79d8c3fccf9f0638 # v3.1.0
